name: Tests

on:
  push:
    branches:
      - master
  pull_request:

env:
  # Pinned so CI matches the environment the integration is developed against.
  # homeassistant 2026.9.1 requires Python >= 3.14.2, which is why the matrix
  # has no older interpreters.
  HOMEASSISTANT_VERSION: "2026.9.1"
  PYTEST_HA_CUSTOM_COMPONENT_VERSION: "0.13.364"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest-homeassistant-custom-component brings pytest and
          # pytest-asyncio, so they are not pinned separately here.
          pip install \
            "homeassistant==${HOMEASSISTANT_VERSION}" \
            "pytest-homeassistant-custom-component==${PYTEST_HA_CUSTOM_COMPONENT_VERSION}"
          pip install -r requirements.txt || true
          if [ -f custom_components/smarthub/manifest.json ]; then
            pip install $(jq -r '.requirements[]' custom_components/smarthub/manifest.json)
          fi
      - name: Show resolved versions
        run: |
          python --version
          pip show homeassistant pytest-homeassistant-custom-component pytest \
            | grep -E '^(Name|Version):'
      - name: Run tests
        run: |
          python -m pytest tests/

name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: HA ${{ matrix.homeassistant }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report both legs even when one fails - a floor break and a current
      # break need different fixes.
      fail-fast: false
      matrix:
        include:
          # The version the integration is developed against.
          - python-version: "3.14"
            homeassistant: "2026.9.1"
            phcc: "0.13.364"
            pins: ""
          # The oldest release the README claims support for. Home Assistant
          # 2025.11 needs Python >= 3.13.2, and cannot run on 3.14.
          - python-version: "3.13"
            homeassistant: "2025.11.3"
            phcc: "0.13.297"
            # This core pins aiodns==3.5.0, which asks for pycares>=4.9.0 with
            # no upper bound. pycares 5 renamed the symbols aiodns imports at
            # module load, so an unconstrained install fails on import.
            pins: "pycares<5"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          HA_VERSION: ${{ matrix.homeassistant }}
          PHCC_VERSION: ${{ matrix.phcc }}
          EXTRA_PINS: ${{ matrix.pins }}
        run: |
          python -m pip install --upgrade pip
          # pytest-homeassistant-custom-component brings pytest and
          # pytest-asyncio, so they are not pinned separately here.
          pip install \
            "homeassistant==${HA_VERSION}" \
            "pytest-homeassistant-custom-component==${PHCC_VERSION}"
          pip install -r requirements.txt || true
          if [ -f custom_components/smarthub/manifest.json ]; then
            pip install $(jq -r '.requirements[]' custom_components/smarthub/manifest.json)
          fi
          # Applied last so nothing above can undo the constraint.
          if [ -n "${EXTRA_PINS}" ]; then
            pip install "${EXTRA_PINS}"
          fi
      - name: Show resolved versions
        run: |
          python --version
          pip show homeassistant pytest-homeassistant-custom-component pytest \
            | grep -E '^(Name|Version):'
      - name: Run tests
        run: |
          python -m pytest tests/

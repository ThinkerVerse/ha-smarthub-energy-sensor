# SmartHub Energy Integration Services

refresh_data:
  name: Refresh Energy Data
  description: Manually refresh energy usage data from SmartHub
  target:
    entity:
      domain: sensor
      integration: smarthub
  
refresh_authentication:
  name: Refresh Authentication
  description: Force refresh of SmartHub authentication token
  target:
    entity:
      domain: sensor
      integration: smarthub

import_history:
  name: Import Historical Usage
  description: >-
    Re-import historical usage, cost and return statistics from SmartHub. The
    import walks backwards in chunks and stops at whatever the provider still
    holds, so asking for more days than exist is harmless. Every reading is
    rewritten from a zero baseline, so delete the existing SmartHub statistics
    first (Developer tools > Statistics) or the running totals will not line up.
  fields:
    days:
      name: Days
      description: How many days of history to import. Defaults to the value configured for the integration.
      required: false
      selector:
        number:
          min: 1
          max: 3650
          unit_of_measurement: days
          mode: box
    entry_id:
      name: Config entry ID
      description: Limit the import to a single SmartHub account. Defaults to all configured accounts.
      required: false
      selector:
        text:
